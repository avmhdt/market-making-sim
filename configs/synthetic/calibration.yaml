# AC-W-10: calibration recovers the generator's A, k and sigma (FR-19 item 4).
# Tick world, one 600 s path per seed (the calibration window), 20 seeds from `seed`.
# A = 3 orders/s per side, k = 10 per price unit (mean depth 10 ticks), sigma = 0.05 per
# square-root second (+-1 tick jumps at 25 per second).
venue: synthetic
symbol: SYN
start_utc: 2026-05-01T00:00:00Z
time_unit_ns: 1000000000
horizon: 600.0
dt: 1.0
tick_size: 0.01
lot_size: 1.0
mid: {kind: tick_jump, s0: 100.0, sigma: 0.05}
market_orders: {A: 3.0, k: 10.0, qty_lots: 1, arrivals: poisson}
book: {levels: 5, half_spread_ticks: 1, level_lots: 10}
feed_latency_ns: 0
feed_jitter_ns: 0
seed: 4242
paths: 20
