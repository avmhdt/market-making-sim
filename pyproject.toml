[project]
name = "market-making-sim"
version = "0.1.0"
description = "Avellaneda-Stoikov and GLFT market making on replayed order books, with exact P&L attribution."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "avmhdt" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "polars>=1.10",
    "pyarrow>=17",
    "typer>=0.12",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

# Extras named by the spec (section 4). Their contents are filled in by the milestone that
# needs them; see docs/decisions.md (M1-03).
[project.optional-dependencies]
# D-02: edbt-sim is not on PyPI; the source (CI wheel or local maturin build) is chosen at M6.
edbt = []
# D-03: crypto-lob-alpha's feature package; decided at the start of M4.
cla = []
tardis = ["tardis-dev>=2.0"]
bol = ["overfitlab>=0.1.1"]

[project.scripts]
mms = "mmsim.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmsim"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "pre-commit>=4.0",
    "overfitlab>=0.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "NPY"]
# N803/N806: the papers' symbols (A, k, Q) are kept as written.
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/mmsim"]
mypy_path = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "scipy.*", "edbt.*", "lightgbm.*", "numba.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
pythonpath = ["tests"]
markers = [
    "slow: full validation runs, local before each milestone exit",
    "data: needs the owner's recorded data, never in CI",
    "signal: needs the real crypto-lob-alpha signal artifact, never in CI",
    "edbt: needs the edbt package installed",
]

[tool.coverage.run]
branch = false
data_file = ".pytest_cache/coverage"
source_pkgs = ["mmsim"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", '^\s*\.\.\.$']
