# Two-minute synthetic day in the canonical schema, shaped like a BTCUSDT book:
# tick 0.1, lot 0.001, +-1-tick mid jumps at sigma^2/tick^2 = 4 per second, market orders
# at 2 per second per side with mean depth 1/k = 0.5 USD (5 ticks), 5 ms feed latency
# with up to 2 ms jitter. Regenerate with: uv run python tests/fixtures/make_fixtures.py
venue: synthetic
symbol: SYNUSDT
start_utc: 2026-01-05T12:00:00Z
time_unit_ns: 1000000000
horizon: 120.0
dt: 1.0
tick_size: 0.1
lot_size: 0.001
mid: {kind: tick_jump, s0: 70000.0, sigma: 0.2}
market_orders: {A: 2.0, k: 2.0, qty_lots: 5}
book: {levels: 5, half_spread_ticks: 1, level_lots: 200}
feed_latency_ns: 5000000
feed_jitter_ns: 2000000
seed: 11
paths: 1
