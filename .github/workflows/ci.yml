name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Licensed-data guard (NFR-07, AC-W-13)
        run: git ls-files -z | xargs -0 uv run python scripts/check_tracked.py

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run mypy

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: >-
          uv run pytest -m "not slow and not data and not edbt and not signal" -n auto
          --cov=mmsim --cov-report=term --cov-fail-under=85

  validate-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - name: Synthetic validation, fast subset (FR-19)
        env:
          MMS_RESULTS_DIR: ${{ runner.temp }}/results
          MMS_REPORTS_DIR: ${{ runner.temp }}/reports
        run: uv run mms validate synthetic --fast

  trial-log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - name: Validate results/trial_log.csv (AC-W-12)
        run: uv run overfitlab trials validate results/trial_log.csv
